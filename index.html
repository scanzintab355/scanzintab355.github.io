<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            color: #1e293b;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Card & Zone Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .tool-zone {
            transition: all 0.3s ease;
        }
        .tool-zone:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        /* Button Animations */
        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-indigo {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }
        .btn-indigo:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.4);
        }

        textarea {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }
    </style>
</head>
<body class="p-4 lg:p-8 flex items-center justify-center">

    <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-8 flex flex-col gap-4">
            
            <div class="glass-panel p-6 rounded-2xl flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600 tracking-tight">Text Tools</h1>
                    <p class="text-slate-500 text-sm font-medium mt-1">Smart Processing & Sorting Suite</p>
                </div>
                <div class="flex gap-2">
                     <button onclick="undo()" class="group flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-colors shadow-sm btn-action" title="Undo last action">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        <span class="text-sm font-semibold">Undo</span>
                    </button>
                    <button onclick="loadSampleText()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors font-medium text-sm btn-action">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        Sample
                    </button>
                </div>
            </div>

            <div class="glass-panel rounded-2xl shadow-xl overflow-hidden flex flex-col flex-grow h-full min-h-[500px]">
                <div class="bg-slate-50/50 border-b border-slate-200 px-4 py-3 flex justify-between items-center backdrop-blur-sm">
                    <div class="flex gap-4 text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-400"></span><span id="lineCount">0</span> Lines</div>
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-400"></span><span id="wordCount">0</span> Words</div>
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-400"></span><span id="charCount">0</span> Chars</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyToClipboard()" class="p-2 hover:bg-white rounded-lg text-slate-500 hover:text-indigo-600 transition-colors" title="Copy to Clipboard">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        </button>
                        <button onclick="clearAll()" class="p-2 hover:bg-red-50 rounded-lg text-slate-500 hover:text-red-600 transition-colors" title="Clear All">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
                
                <textarea 
                    id="textInput" 
                    oninput="updateCounters()"
                    class="w-full flex-grow p-6 bg-transparent border-none outline-none resize-none text-slate-700 leading-relaxed text-sm lg:text-base"
                    placeholder="Enter your list here..."
                ></textarea>
            </div>
            
            <div id="resultTableSection" class="hidden glass-panel rounded-2xl p-6 border-l-4 border-indigo-500">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span id="tableTitleText">Result Analysis</span>
                    </h3>
                    <button onclick="closeResultTable()" class="text-slate-400 hover:text-red-500 text-sm font-semibold">Close</button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-slate-200">
                    <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
                        <thead class="bg-slate-50 font-semibold text-slate-600">
                            <tr>
                                <th class="px-4 py-3">#</th>
                                <th class="px-4 py-3">Item</th>
                                <th class="px-4 py-3" id="tableHeaderStats">Frequency</th>
                            </tr>
                        </thead>
                        <tbody id="resultTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <div class="lg:col-span-4 flex flex-col gap-6">
            
            <div class="glass-panel p-5 rounded-2xl tool-zone">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Sorting Strategy</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                        <span class="text-sm font-medium text-slate-600">Method</span>
                        <div class="flex gap-1 bg-slate-100 p-1 rounded-lg">
                            <button onclick="setSortMethod('native')" id="btn-native" class="px-3 py-1 rounded-md text-xs font-semibold text-slate-500 hover:bg-white hover:shadow-sm transition-all">Native</button>
                            <button onclick="setSortMethod('natural')" id="btn-natural" class="px-3 py-1 rounded-md text-xs font-semibold bg-white text-indigo-600 shadow-sm ring-1 ring-black/5">Natural</button>
                        </div>
                    </div>
                    <label class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 shadow-sm cursor-pointer hover:bg-slate-50 transition-colors">
                        <span class="text-sm font-medium text-slate-600">Case Insensitive</span>
                        <input type="checkbox" id="caseInsensitive" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300">
                    </label>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl tool-zone">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Sorters</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="sortAlphabetical()" class="btn-indigo btn-action text-white px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
                        A-Z Sort
                    </button>
                    <button onclick="reverseOrder()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-indigo-200 hover:text-indigo-600 btn-action px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
                        Reverse
                    </button>
                    <button onclick="sortByLength()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-indigo-200 hover:text-indigo-600 btn-action px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h6"></path></svg>
                        Length
                    </button>
                    <button onclick="sortByWordCount()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-indigo-200 hover:text-indigo-600 btn-action px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                         <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>
                        Words
                    </button>
                    <button onclick="sortByMonth()" class="col-span-2 bg-gradient-to-r from-violet-500 to-purple-500 text-white hover:from-violet-600 hover:to-purple-600 btn-action px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md shadow-violet-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Sort Keywords by Month
                    </button>
                    <button onclick="sortRandomly()" class="col-span-2 bg-gradient-to-r from-pink-500 to-rose-500 text-white hover:from-pink-600 hover:to-rose-600 btn-action px-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md shadow-pink-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Random Shuffle
                    </button>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl tool-zone">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Clean Up</h3>
                <div class="space-y-2">
                    <button onclick="removeDuplicates()" title="Remove duplicate lines of text or delimited items within a list." class="w-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-emerald-200 hover:text-emerald-600 btn-action px-4 py-2.5 rounded-xl text-sm font-medium flex items-center justify-between group">
                        <span>Remove Duplicates</span>
                        <svg class="w-4 h-4 text-slate-300 group-hover:text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 00-2 2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </button>
                    <button onclick="removeBlankLines()" class="w-full bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-amber-200 hover:text-amber-600 btn-action px-4 py-2.5 rounded-xl text-sm font-medium flex items-center justify-between group">
                        <span>Remove Blank Lines</span>
                        <svg class="w-4 h-4 text-slate-300 group-hover:text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                </div>
            </div>

             <div class="glass-panel p-5 rounded-2xl tool-zone">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Formatting</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="convertToCase('upper')" class="bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 btn-action py-2 rounded-xl text-xs font-bold">ABC</button>
                    <button onclick="convertToCase('lower')" class="bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 btn-action py-2 rounded-xl text-xs font-bold">abc</button>
                    <button onclick="convertToCase('title')" class="bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 btn-action py-2 rounded-xl text-xs font-bold">Abc</button>
                </div>
            </div>

        </div>
    </div>

    <div id="statusMsg" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white px-6 py-3 rounded-full shadow-2xl backdrop-blur-md text-sm font-medium opacity-0 transition-all duration-300 translate-y-4 pointer-events-none z-50 flex items-center gap-2">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="statusText">Action completed</span>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const statusMsg = document.getElementById('statusMsg');
        const statusText = document.getElementById('statusText');
        const lineCounter = document.getElementById('lineCount');
        const wordCounter = document.getElementById('wordCount');
        const charCounter = document.getElementById('charCount');

        let undoStack = [];
        let sortMethodValue = 'natural';

        // Initialize
        function init() {
            updateCounters();
        }

        // --- History / Undo ---
        function pushUndo() {
            if (undoStack.length > 20) undoStack.shift();
            undoStack.push(textInput.value);
        }

        function undo() {
            if (undoStack.length > 0) {
                textInput.value = undoStack.pop();
                updateCounters();
                showStatus("Undone last action", "info");
            } else {
                showStatus("Nothing to undo", "info");
            }
        }

        // --- Core Utils ---
        function showStatus(msg, type = 'success') {
            statusText.textContent = msg;
            statusMsg.classList.remove('opacity-0', 'translate-y-4');
            statusMsg.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                statusMsg.classList.remove('opacity-100', 'translate-y-0');
                statusMsg.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }

        function updateCounters() {
            const text = textInput.value;
            const lines = text.split(/\r?\n/);
            const actualLines = text.length === 0 ? 0 : lines.length;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);

            lineCounter.textContent = actualLines.toLocaleString();
            wordCounter.textContent = words.length.toLocaleString();
            charCounter.textContent = text.length.toLocaleString();
        }

        function getLines() {
            const val = textInput.value;
            if (!val.trim()) return [];
            return val.split(/\r?\n/).filter(line => line.length > 0);
        }

        function setLines(lines) {
            pushUndo();
            textInput.value = lines.join('\n');
            updateCounters();
        }

        // --- Controls ---
        function setSortMethod(method) {
            sortMethodValue = method;
            document.getElementById('btn-native').className = method === 'native' 
                ? "px-3 py-1 rounded-md text-xs font-semibold bg-white text-indigo-600 shadow-sm ring-1 ring-black/5 transition-all"
                : "px-3 py-1 rounded-md text-xs font-semibold text-slate-500 hover:bg-white hover:shadow-sm transition-all";
            
            document.getElementById('btn-natural').className = method === 'natural'
                ? "px-3 py-1 rounded-md text-xs font-semibold bg-white text-indigo-600 shadow-sm ring-1 ring-black/5 transition-all"
                : "px-3 py-1 rounded-md text-xs font-semibold text-slate-500 hover:bg-white hover:shadow-sm transition-all";
        }

        function loadSampleText() {
            pushUndo();
            const samples = [
                "Banana", "April events", "10 items", "February highlights", "Orange juice", 
                "December sales", "Grape fruit", "100 items", "January update", "Banana", 
                "March budget", "Banana"
            ];
            textInput.value = samples.join('\n');
            updateCounters();
            showStatus("Sample text loaded");
        }

        function copyToClipboard() {
            if (!textInput.value) return;
            textInput.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            showStatus("Copied to clipboard!");
        }

        // --- Sorting ---
        function sortAlphabetical() {
            let lines = getLines();
            if (lines.length === 0) return;

            const isCaseInsensitive = document.getElementById('caseInsensitive').checked;

            lines.sort((a, b) => {
                let s1 = isCaseInsensitive ? a.toLowerCase() : a;
                let s2 = isCaseInsensitive ? b.toLowerCase() : b;

                if (sortMethodValue === 'natural') {
                    return s1.localeCompare(s2, undefined, { numeric: true, sensitivity: isCaseInsensitive ? 'base' : 'variant' });
                } else {
                    return s1.localeCompare(s2);
                }
            });

            setLines(lines);
            showStatus(`Sorted (A-Z)`);
        }

        function sortByLength() {
            let lines = getLines();
            if (lines.length === 0) return;
            lines.sort((a, b) => a.length - b.length || a.localeCompare(b));
            setLines(lines);
            showStatus("Sorted by length");
        }

        function sortByWordCount() {
            let lines = getLines();
            if (lines.length === 0) return;
            lines.sort((a, b) => {
                const countA = a.trim().split(/\s+/).length;
                const countB = b.trim().split(/\s+/).length;
                return countA - countB || a.localeCompare(b);
            });
            setLines(lines);
            showStatus("Sorted by word count");
        }
        
        function sortByMonth() {
            let lines = getLines();
            if (lines.length === 0) return;

            const months = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
            const shortMonths = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

            function getMonthIndex(str) {
                const lowerStr = str.toLowerCase();
                for (let i = 0; i < 12; i++) {
                    const regexFull = new RegExp(`\\b${months[i]}\\b`, 'i');
                    if (regexFull.test(lowerStr)) return i;
                    
                    const regexShort = new RegExp(`\\b${shortMonths[i]}\\b`, 'i');
                    if (regexShort.test(lowerStr)) return i;
                }
                return 99; // Items without a recognized month go to the bottom
            }

            lines.sort((a, b) => {
                const indexA = getMonthIndex(a);
                const indexB = getMonthIndex(b);
                if (indexA === indexB) {
                    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
                }
                return indexA - indexB;
            });

            setLines(lines);

            const freqMap = {};
            const uniqueLines = [];

            lines.forEach(line => {
                if (!freqMap[line]) {
                    freqMap[line] = 0;
                    uniqueLines.push(line);
                }
                freqMap[line]++;
            });

            showResultTable(uniqueLines, freqMap, "Sorting Analysis", "default");
            showStatus("Sorted by Month");
        }

        function sortRandomly() {
            let lines = getLines();
            if (lines.length === 0) return;
            for (let i = lines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lines[i], lines[j]] = [lines[j], lines[i]];
            }
            setLines(lines);
            showStatus("Shuffled randomly");
        }

        function reverseOrder() {
            let lines = getLines();
            if (lines.length === 0) return;
            lines.reverse();
            setLines(lines);
            showStatus("Order reversed");
        }

        // --- Processing ---
        function removeDuplicates() {
            const val = textInput.value;
            if (!val.trim()) return;
            
            let delimiter = '\n';
            let lines = val.split(/\r?\n/);

            // Smart detection for single line comma-delimited strings
            if (lines.length === 1 && val.includes(',')) {
                lines = val.split(',').map(s => s.trim()).filter(l => l.length > 0);
                delimiter = ', ';
            } else {
                // Trim the lines before evaluating to ensure duplicates with trailing spaces are caught
                lines = lines.map(s => s.trim()).filter(l => l.length > 0);
            }

            const freqMap = {};
            const uniqueLines = [];
            const removedItems = [];

            lines.forEach(line => {
                if (!freqMap[line]) {
                    freqMap[line] = 0;
                    uniqueLines.push(line);
                } else if (freqMap[line] === 1) {
                    // It's a duplicate. Push it to the removedItems array exactly once
                    removedItems.push(line); 
                }
                freqMap[line]++;
            });

            pushUndo();
            textInput.value = uniqueLines.join(delimiter);
            updateCounters();

            // Explicitly show ONLY the items that had duplicates removed
            showResultTable(removedItems, freqMap, "Removed Duplicates", "removed");
            showStatus(`Removed ${lines.length - uniqueLines.length} duplicates`);
        }

        function removeBlankLines() {
            let lines = textInput.value.split(/\r?\n/);
            const filtered = lines.filter(line => line.trim().length > 0);
            setLines(filtered);
            showStatus("Blank lines removed");
        }

        function convertToCase(type) {
            let lines = textInput.value.split(/\r?\n/);
            const converted = lines.map(line => {
                if (line.trim().length === 0) return line;
                switch(type) {
                    case 'upper': return line.toUpperCase();
                    case 'lower': return line.toLowerCase();
                    case 'title': return line.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
                    default: return line;
                }
            });
            setLines(converted);
            showStatus(`Converted to ${type} case`);
        }

        function clearAll() {
            if (textInput.value && confirm("Clear all text?")) {
                pushUndo();
                textInput.value = "";
                closeResultTable();
                updateCounters();
                showStatus("Cleared");
            }
        }

        // --- Result Table ---
        function showResultTable(items, freqMap, title = "Result Analysis", mode = "default") {
            const section = document.getElementById('resultTableSection');
            const tbody = document.getElementById('resultTableBody');
            const titleEl = document.getElementById('tableTitleText');
            const headerStatsEl = document.getElementById('tableHeaderStats');
            
            if (titleEl) titleEl.textContent = title;
            if (headerStatsEl) {
                headerStatsEl.textContent = mode === 'removed' ? 'Amount Removed' : 'Frequency';
            }
            
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-3 text-center text-slate-500 text-sm">No duplicate items found</td></tr>`;
            } else {
                items.slice(0, 100).forEach((item, index) => { // Limit to 100 for performance
                    const row = document.createElement('tr');
                    row.className = index % 2 === 0 ? 'bg-white' : 'bg-slate-50/50';
                    
                    let freqBadge = '';
                    if (mode === 'removed') {
                        // Math: If freqMap[item] is 3, that means 1 is kept, 2 are removed
                        const removedCount = freqMap[item] - 1;
                        freqBadge = `<span class="bg-red-50 border border-red-200 text-red-700 px-2.5 py-1 rounded-md text-xs font-bold shadow-sm">
                                        - ${removedCount} deleted
                                     </span>`;
                    } else {
                        freqBadge = `<span class="${freqMap[item] > 1 ? 'bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full text-xs font-bold' : 'text-slate-400 text-xs'}">${freqMap[item]}</span>`;
                    }

                    row.innerHTML = `
                        <td class="px-4 py-3 border-b border-slate-100 text-slate-400 font-mono text-xs">${index + 1}</td>
                        <td class="px-4 py-3 border-b border-slate-100 font-medium text-slate-700 break-all">${item}</td>
                        <td class="px-4 py-3 border-b border-slate-100">
                            ${freqBadge}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            section.classList.remove('hidden');
        }

        function closeResultTable() {
            document.getElementById('resultTableSection').classList.add('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
